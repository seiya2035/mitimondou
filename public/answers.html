<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>未知問答 ｜ みんなの回答</title>
    <link rel="stylesheet" href="css/answers.css?v=1">
</head>
<body>
    <main class="wrap">
        <h1>未知問答</h1>
        <p class="lead">未来想像展で届いた回答を見返せます。新しい回答は自動で追加されます。</p>

        <div class="tabs" role="group" aria-label="表示する回答">
            <button type="button" data-filter="all" aria-pressed="true">みんなの回答</button>
            <button type="button" data-filter="mine" aria-pressed="false">自分の回答</button>
        </div>

        <p class="count" id="count">読み込み中…</p>
        <ol id="list"></ol>
        <p class="empty" id="empty" hidden></p>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="js/answers.js"></script>
</body>
</html>
