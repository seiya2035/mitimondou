<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>未知問答 ｜ 管理</title>
    <style>
        :root {
            --bg: #e7e9ee;
            --ink: #1b2340;
            --muted: #6b7391;
            --line: #c9cfdc;
            --surface: #ffffff;
            --danger: #c62828;
            --accent: #3d5afe;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
            line-height: 1.5;
        }
        .wrap { max-width: 880px; margin: 0 auto; padding: 24px 16px 64px; }
        h1 { font-size: 1.3rem; margin: 0 0 16px; }
        button, input { font: inherit; }
        button {
            padding: 8px 14px;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: var(--surface);
            color: var(--ink);
            cursor: pointer;
        }
        button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
        button.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
        input { padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; }

        .login { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .message { min-height: 1.5em; color: var(--danger); margin: 8px 0; }

        .toolbar {
            display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
            padding: 12px; background: var(--surface); border-radius: 6px; margin-bottom: 12px;
        }
        .toolbar .count { margin-right: auto; color: var(--muted); }

        table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: 6px; overflow: hidden; }
        th, td { padding: 10px; border-bottom: 1px solid var(--bg); text-align: left; vertical-align: top; }
        th { font-size: 0.8rem; color: var(--muted); font-weight: 600; }
        td.time { white-space: nowrap; font-size: 0.85rem; color: var(--muted); }
        td.topic { font-size: 0.85rem; color: var(--muted); max-width: 220px; }
        td.answer { font-size: 1rem; word-break: break-word; }
        td.action { white-space: nowrap; text-align: right; }
        tr.is-hidden td.answer { text-decoration: line-through; color: var(--muted); }
        .state { font-size: 0.75rem; color: var(--danger); display: block; }

        @media (max-width: 600px) {
            td.topic, th.topic { display: none; }
        }
    </style>
</head>
<body>
    <main class="wrap">
        <h1>未知問答 管理</h1>

        <section id="loginView">
            <form class="login" id="loginForm">
                <label for="password">パスワード</label>
                <input type="password" id="password" autocomplete="current-password" required>
                <button type="submit">ログイン</button>
            </form>
            <p class="message" id="loginMessage" role="alert"></p>
        </section>

        <section id="adminView" hidden>
            <div class="toolbar">
                <span class="count" id="count"></span>
                <button type="button" id="reloadBtn">再読み込み</button>
                <button type="button" id="logoutBtn">ログアウト</button>
                <button type="button" class="danger" id="resetBtn">全ての回答を消す</button>
            </div>
            <p class="message" id="adminMessage" role="alert"></p>
            <table>
                <thead>
                    <tr>
                        <th>時刻</th>
                        <th class="topic">お題</th>
                        <th>回答</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="rows"></tbody>
            </table>
        </section>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
